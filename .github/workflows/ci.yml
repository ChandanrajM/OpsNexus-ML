name: Continuous Integration

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

env:
  PYTHON_VERSION: '3.12'
  POETRY_VERSION: '1.8.3'

jobs:
  lint-and-format:
    name: Lint & Format Check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install flake8 black isort mypy pylint

      - name: Check code formatting with Black
        run: black --check --diff .

      - name: Check import sorting with isort
        run: isort --check-only --diff .

      - name: Lint with flake8
        run: flake8 --max-line-length=100 --ignore=E203,W503 .

      - name: Type check with mypy
        run: mypy --ignore-missing-imports --no-strict-optional api models data_pipeline evaluation || true

      - name: Lint with pylint
        run: pylint --rcfile=.pylintrc api models data_pipeline evaluation || true

  unit-tests:
    name: Unit Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest pytest-cov pytest-mock

      - name: Run unit tests
        run: |
          pytest tests/unit/ -v --cov=. --cov-report=xml --cov-report=term-missing || true

      - name: Upload coverage
        uses: codecov/codecov-action@v4
        if: always()
        with:
          files: ./coverage.xml
          fail_ci_if_error: false

  integration-tests:
    name: Integration Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest pytest-mock requests-mock

      - name: Start test services
        run: |
          # Start any required test services (mock APIs, databases, etc.)
          echo "Starting test services..."
          # In a real setup, this would start mock services via docker-compose

      - name: Run integration tests
        run: |
          pytest tests/integration/ -v || true

      - name: Run API tests
        run: |
          pytest tests/api/ -v || true

  model-validation:
    name: Model Validation
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install scikit-learn pandas numpy

      - name: Validate model versioning system
        run: |
          python -c "
from model_versioning import ModelVersionManager
import tempfile
import os

# Test with temporary directory
with tempfile.TemporaryDirectory() as tmpdir:
    vm = ModelVersionManager(model_registry_path=os.path.join(tmpdir, 'registry'))

    # Test registration
    import pickle
    class DummyModel:
        def __init__(self): self.value = 42
        def predict(self, X): return [1.0] * len(X)

    model = DummyModel()
    model_path = os.path.join(tmpdir, 'test_model.pkl')
    with open(model_path, 'wb') as f:
        pickle.dump(model, f)

    version_id = vm.register_model('cpu_predictor', model_path,
                                   metadata={'mae': 2.5},
                                   description='Test model')
    print(f'Registered version: {version_id}')

    # Test loading
    loaded = vm.load_model('cpu_predictor')
    print(f'Loaded model type: {type(loaded)}')

    # Test listing
    versions = vm.list_model_versions('cpu_predictor')
    print(f'Total versions: {len(versions)}')

    print('Model versioning validation: PASSED')
"

      - name: Validate anomaly detection model
        run: |
          python -c "
import sys
sys.path.append('.')
from models.isolation_forest_detector import IsolationForestDetector
import numpy as np

# Test basic functionality
detector = IsolationForestDetector(n_estimators=10, random_state=42)

# Generate synthetic training data
np.random.seed(42)
X_train = np.random.randn(100, 10)
detector.fit(X_train)

# Test prediction
X_test = np.random.randn(5, 10)
scores = detector.predict_anomaly_score(X_test)
predictions = detector.detect_anomaly(X_test)

print(f'Anomaly scores shape: {scores.shape}')
print(f'Predictions shape: {predictions.shape}')
print(f'Scores range: {scores.min():.3f} - {scores.max():.3f}')

# Test explainability
explanation = detector.explain_anomaly(X_test[:1], sample_idx=0, top_n=3)
print(f'Explanation keys: {list(explanation.keys())}')
print('Anomaly detection validation: PASSED')
"

      - name: Validate baseline model
        run: |
          python -c "
import sys
sys.path.append('.')
from baseline_model import CPUUsagePredictor
import numpy as np

# Test basic functionality
predictor = CPUUsagePredictor()

# Generate synthetic training data
np.random.seed(42)
n_samples = 100
n_features = 10
X_train = np.random.randn(n_samples, n_features)
y_train = np.random.rand(n_samples) * 100

predictor.fit(X_train, y_train)

# Test prediction
X_test = np.random.randn(5, n_features)
predictions = predictor.predict(X_test)

print(f'Predictions shape: {predictions.shape}')
print(f'Predictions range: {predictions.min():.2f} - {predictions.max():.2f}')

# Test feature importance
importance = predictor.get_feature_importance()
print(f'Feature importance keys: {len(importance)}')
print('Baseline model validation: PASSED')
"

  security-scan:
    name: Security Scan
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install bandit safety

      - name: Run bandit security scan
        run: |
          bandit -r api/ models/ data_pipeline/ evaluation/ -f json -o bandit-report.json || true
          bandit -r api/ models/ data_pipeline/ evaluation/ || true

      - name: Run safety dependency check
        run: |
          safety check --json --output safety-report.json || true
          safety check || true

      - name: Upload security reports
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: security-reports
          path: |
            bandit-report.json
            safety-report.json

  docker-build:
    name: Docker Build Test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: false
          tags: opsnexus-ml:test
          load: true
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Test Docker image
        run: |
          # Test that the image runs and health endpoint responds
          docker run -d --name opsnexus-ml-test -p 5000:5000 opsnexus-ml:test
          sleep 10
          curl -f http://localhost:5000/health || (docker logs opsnexus-ml-test && exit 1)
          docker stop opsnexus-ml-test
          docker rm opsnexus-ml-test

  dependency-check:
    name: Dependency Check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: 'pip'

      - name: Check for outdated packages
        run: |
          pip list --outdated --format=json | jq '.[] | "\(.name): \(.version) -> \(.latest_version)"' || true

      - name: Check for vulnerable packages
        run: |
          pip install pip-audit
          pip-audit --format=json --output=pip-audit-report.json || true
          pip-audit || true

      - name: Upload dependency report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: dependency-reports
          path: pip-audit-report.json