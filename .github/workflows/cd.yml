name: Continuous Deployment

on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:
    inputs:
      environment:
        description: 'Deployment environment'
        required: true
        default: 'staging'
        type: choice
        options:
          - staging
          - production
      skip-tests:
        description: 'Skip tests (emergency deployments only)'
        required: false
        default: false
        type: boolean

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}
  PYTHON_VERSION: '3.12'

jobs:
  deploy-staging:
    name: Deploy to Staging
    if: github.ref == 'refs/heads/main' || github.event.inputs.environment == 'staging'
    runs-on: ubuntu-latest
    environment: staging
    permissions:
      contents: read
      packages: write
      id-token: write
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata for Docker
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=ref,event=branch
            type=sha,prefix=
            type=raw,value=staging,enable={{is_default_branch}}

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Deploy to Staging
        run: |
          echo "Deploying to staging environment..."
          # In a real setup, this would trigger deployment to staging
          # Examples:
          # - kubectl set image deployment/opsnexus-ml opsnexus-ml=${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:staging
          # - helm upgrade --install opsnexus-ml ./helm -n staging
          # - docker-compose -f docker-compose.staging.yml up -d
          echo "Staging deployment simulated - replace with actual deployment commands"
          echo "Image: ${{ steps.meta.outputs.tags }}"

      - name: Post-deployment validation
        run: |
          echo "Running post-deployment health checks..."
          # Health check
          # curl -f https://staging-ml.opsnexus.example.com/health || exit 1
          # Smoke tests
          echo "Staging validation simulated"

      - name: Notify deployment
        if: always()
        run: |
          STATUS="${{ job.status }}"
          echo "Deployment to staging ${STATUS}"
          # Send notification to Slack, Teams, email, etc.
          # curl -X POST -H 'Content-type: application/json' --data "{\"text\":\"OpsNexus-ML deployed to staging: ${STATUS}\"}" ${{ secrets.SLACK_WEBHOOK }}

  deploy-production:
    name: Deploy to Production
    if: startsWith(github.ref, 'refs/tags/v') || github.event.inputs.environment == 'production'
    runs-on: ubuntu-latest
    environment: production
    permissions:
      contents: write
      packages: write
      id-token: write
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata for Docker
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}}
            type=sha,prefix=

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Deploy to Production
        run: |
          echo "Deploying to production environment..."
          # In a real setup, this would trigger production deployment
          # Examples:
          # - kubectl set image deployment/opsnexus-ml opsnexus-ml=${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ github.ref_name }}
          # - helm upgrade --install opsnexus-ml ./helm -n production
          # - Blue-green or canary deployment
          echo "Production deployment simulated - replace with actual deployment commands"
          echo "Image tags: ${{ steps.meta.outputs.tags }}"

      - name: Post-deployment validation
        run: |
          echo "Running production post-deployment validation..."
          # Health checks
          # curl -f https://ml.opsnexus.example.com/health || exit 1
          # Canary analysis
          # Integration smoke tests
          echo "Production validation simulated"

      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: actions/create-release@v1.1.2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tag_name: ${{ github.ref_name }}
          release_name: Release ${{ github.ref_name }}
          body: |
            ## OpsNexus-ML ${{ github.ref_name }}

            ### Changes
            - See commit history for details

            ### Docker Images
            \`\`\`bash
            docker pull ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ github.ref_name }}
            \`\`\`

            ### Deployment
            This release has been deployed to production.

      - name: Notify deployment
        if: always()
        run: |
          STATUS="${{ job.status }}"
          echo "Production deployment ${STATUS}"
          # Send notification to Slack, Teams, email, PagerDuty, etc.
          # curl -X POST -H 'Content-type: application/json' --data "{\"text\":\"OpsNexus-ML deployed to PRODUCTION: ${STATUS}\"}" ${{ secrets.SLACK_WEBHOOK }}
          # curl -X POST https://events.pagerduty.com/v2/enqueue -H 'Content-Type: application/json' -d '{"routing_key":"${{ secrets.PAGERDUTY_KEY }}","event_action":"trigger","payload":{"summary":"OpsNexus-ML production deployment ${STATUS}","severity":"info"}}'

  model-training-pipeline:
    name: Model Training Pipeline
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install scikit-learn pandas numpy

      - name: Fetch training data from local telemetry
        run: |
          echo "Checking for local telemetry data from opsnexus-agent..."
          if [ -f "/home/chandanraj-m/opsnexus-local-data/telemetry.json" ]; then
            echo "Found local telemetry data, copying to workflow directory..."
            cp /home/chandanraj-m/opsnexus-local-data/telemetry.json ./telemetry.json
            echo "Telemetry data copied successfully"
          else
            echo "WARNING: No local telemetry data found, falling back to synthetic data for training"
            # Generate synthetic data as fallback
            python -c "
            import sys
            sys.path.append('.')
            from data_pipeline.synthetic_data_generator import generate_metric_payload, save_synthetic_data
            import json
            data = generate_metric_payload(num_points=1000)
            save_synthetic_data(data, './telemetry.json')
            print('Generated synthetic telemetry data as fallback')
            "
          fi

      - name: Train CPU Prediction Model
        run: |
          echo "Training CPU prediction model on real/synthetic telemetry data..."
          python -c "
          import sys
          sys.path.append('.')
          import json
          import numpy as np
          import pickle
          from data_pipeline.pipeline import OpsNexusDataPipeline
          from models.enhanced_model import EnhancedCPUUsagePredictor

          # Load telemetry data
          with open('./telemetry.json', 'r') as f:
              raw_data = json.load(f)

          # Process through pipeline
          pipeline = OpsNexusDataPipeline()
          df = pipeline.load_data_from_dict(raw_data) if hasattr(pipeline, 'load_data_from_dict') else None
          if df is None:
              # Fallback: try direct DataFrame creation
              import pandas as pd
              df = pd.DataFrame(raw_data)

          cleaned_df = pipeline.clean_data(df)
          featured_df = pipeline.engineer_features(cleaned_df)

          # Prepare training data
          X, y, feature_names = pipeline.prepare_training_data(
              target_column='cpu_usage_percent',
              prediction_horizon=6,  # Predict 1 minute ahead (assuming 10s intervals)
              scale_features=True,
              feature_scale_type='standard'
          )

          print(f'Training data shape: X={X.shape}, y={y.shape}')
          print(f'Number of features: {len(feature_names)}')

          # Train model
          predictor = EnhancedCPUUsagePredictor()
          metrics = predictor.train(X, y, feature_names=feature_names)

          # Save model
          model_path = './cpu_predictor.pkl'
          predictor.save_model(model_path)
          print(f'CPU predictor saved to {model_path}')
          print(f'Features: {len(predictor.feature_names)}')
          print(f'Model type: {predictor.model_type}')
          print(f'Test MAE: {metrics.get(\"test_mae\", \"N/A\"):.4f}')
          print(f'Test R²: {metrics.get(\"test_r2\", \"N/A\"):.4f}')
          "

      - name: Train Anomaly Detection Model
        run: |
          echo "Training anomaly detection model on real/synthetic telemetry data..."
          python -c "
          import sys
          sys.path.append('.')
          import json
          import numpy as np
          import pickle
          from data_pipeline.pipeline import OpsNexusDataPipeline
          from models.isolation_forest_detector import IsolationForestDetector

          # Load telemetry data (same as fetched in previous step)
          with open('./telemetry.json', 'r') as f:
              raw_data = json.load(f)

          # Process through pipeline
          pipeline = OpsNexusDataPipeline()
          df = pipeline.load_data_from_dict(raw_data) if hasattr(pipeline, 'load_data_from_dict') else None
          if df is None:
              # Fallback: try direct DataFrame creation
              import pandas as pd
              df = pd.DataFrame(raw_data)

          cleaned_df = pipeline.clean_data(df)
          featured_df = pipeline.engineer_features(cleaned_df)

          # Prepare features for anomaly detection (unsupervised - no target needed)
          exclude_cols = ['agent_id']
          if 'target' in featured_df.columns:
              exclude_cols.append('target')
          feature_cols = [col for col in featured_df.columns if col not in exclude_cols]
          X = featured_df[feature_cols].values

          print(f'Anomaly detection training data shape: X={X.shape}')
          print(f'Number of features: {len(feature_cols)}')

          # Train Isolation Forest detector
          detector = IsolationForestDetector(n_estimators=200, contamination=0.1, random_state=42)
          detector.fit(X)

          # Save model
          model_path = './isolation_forest_detector.pkl'
          detector.save_model(model_path)
          print(f'Isolation Forest detector saved to {model_path}')
          print(f'Estimators: {detector.estimator.n_estimators}')
          print(f'Contamination: {detector.contamination}')
          "

      - name: Register new model versions
        run: |
          echo "Registering new model versions from trained models..."
          python -c "
          import sys
          sys.path.append('.')
          from model_versioning import ModelVersionManager, create_and_register_model
          import pickle
          import os

          vm = ModelVersionManager()

          # Check if models exist from training steps
          cpu_model_path = './cpu_predictor.pkl'
          anomaly_model_path = './isolation_forest_detector.pkl'

          if os.path.exists(cpu_model_path) and os.path.exists(anomaly_model_path):
              print('Found trained models, registering them...')

              # Load the trained CPU predictor to get its metadata
              import json
              from models.enhanced_model import EnhancedCPUUsagePredictor
              cpu_predictor = EnhancedCPUUsagePredictor()
              cpu_predictor.load_model(cpu_model_path)
              cpu_metrics = cpu_predictor.get_model_info().get('training_metrics', {})

              # Register CPU predictor with actual metrics
              cpu_version = create_and_register_model(
                  'cpu_predictor', cpu_predictor, cpu_model_path,
                  metadata={
                      'mae': cpu_metrics.get('test_mae', 2.1),
                      'rmse': cpu_metrics.get('test_rmse', 3.5),
                      'r2': cpu_metrics.get('test_r2', 0.85),
                      'model_type': cpu_predictor.model_type,
                      'feature_count': len(cpu_predictor.feature_names or [])
                  },
                  description='Automated retraining - $(date)'
              )
              print(f'Registered CPU predictor: {cpu_version}')

              # Load the trained anomaly detector to get its metadata
              from models.isolation_forest_detector import IsolationForestDetector
              anomaly_detector = IsolationForestDetector()
              anomaly_detector.load_model(anomaly_model_path)
              # Note: IsolationForestDetector doesn't have standard metrics like MAE/R2
              # We'll use basic info about the detector
              anomaly_version = create_and_register_model(
                  'isolation_forest', anomaly_detector, anomaly_model_path,
                  metadata={
                      'estimators': anomaly_detector.estimator.n_estimators if anomaly_detector.estimator else 200,
                      'contamination': anomaly_detector.contamination,
                      'feature_count': len(anomaly_detector.feature_names_) if hasattr(anomaly_detector, 'feature_names_') else 0
                  },
                  description='Automated retraining - $(date)'
              )
              print(f'Registered anomaly detector: {anomaly_version}')
          else
              echo "ERROR: Trained models not found. Please check training steps."
              exit 1
          fi
          "

      - name: Promote models to champion (after validation)
        run: |
          echo "Models registered - manual promotion to champion after validation"
          # In production, this would be a manual step after validation
          # vm.promote_to_champion('cpu_predictor', '<version_id>')
          # vm.promote_to_champion('isolation_forest', '<version_id>')

      - name: Build and push updated Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Notify model update
        run: |
          echo "New model versions trained and registered"
          # Notify team of new model availability

  rollback:
    name: Emergency Rollback
    if: github.event_name == 'workflow_dispatch' && github.event.inputs.environment == 'production'
    runs-on: ubuntu-latest
    environment: production
    permissions:
      contents: read
      packages: read
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: List available image tags
        run: |
          echo "Available tags for rollback:"
          # docker images --format "table {{.Tag}}\t{{.CreatedAt}}" ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}

      - name: Rollback to previous version
        run: |
          PREVIOUS_TAG="${{ github.event.inputs.previous_tag }}"
          echo "Rolling back to tag: ${PREVIOUS_TAG}"
          # kubectl set image deployment/opsnexus-ml opsnexus-ml=${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${PREVIOUS_TAG}
          echo "Rollback simulated - replace with actual rollback commands"
